# splat configuration for SCUS-94244 (NTSC-U).
# Generated by tools/gen_config.py, then maintained by hand: split the asm
# subsegments into c files as their boundaries are discovered.
name: SCUS_942.44
sha1: ffa9252384eb16ce5ae14061bb87c86701ab4893
options:
  basename: main
  base_path: ../..
  target_path: disc/SCUS_942.44
  elf_path: build/us/main.elf
  platform: psx
  compiler: PSYQ

  asm_path: asm/us
  src_path: src
  asset_path: assets/us
  build_path: build/us
  cache_path: asm/us/.splache
  ld_script_path: asm/us/main.ld
  undefined_funcs_auto_path: asm/us/undefined_funcs_auto.txt
  undefined_syms_auto_path: asm/us/undefined_syms_auto.txt
  symbol_addrs_path:
    - config/us/symbol_addrs.txt
  reloc_addrs_path:
    - config/us/reloc_addrs.txt

  gp_value: 0x80060878
  find_file_boundaries: True
  # Keep asm for decompiled functions too: used by tools/progress.py and asm-differ.
  disassemble_all: True
  o_as_suffix: False
  use_legacy_include_asm: False
  migrate_rodata_to_functions: True
  # Game code is compiled with -G8; see the maspsx README.
  include_asm_macro_style: maspsx_hack
  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]
  subalign: 4
  # The PSY-Q linker does not align sections: keep splat from doing it.
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  ld_bss_is_noload: True

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    # .sbss and .bss, cleared by the PSY-Q startup code (__SN_ENTRY_POINT).
    bss_size: 0xE040
    subsegments:
      - [0x800, .rodata, ns]
      - [0xA30, .rodata, sys]
      - [0xB6C, .rodata, obj]
      - [0xBE0, .rodata, interp]
      - [0xBF8, .rodata, camera]
      - [0xC48, .rodata, coll]
      - [0xCE0, .rodata, prop]
      - [0xD2C, rodata, "D2C"]
      - [0x181C, asm, heap]       # memory allocator: InitHeap, malloc, free, ...
      - [0x1E28, c, main]
      - [0x2768, asm, "2768"]     # render setup + empty stubs
      - [0x27D0, c, ns]           # NSF/NSD paging ("ns.c" in c1)
      - [0x5CAC, c, sys]          # system: CD, events, heap, overlays, video, memory card
      - [0x8808, c, gfx]          # textures, sprites (GTE)
      - [0x9E24, c, gool]         # GOOL objects: tree, lists, init/kill
      - [0xB8BC, c, obj]          # object models: animation frames, collision, drawing
      - [0xD96C, c, interp]       # GOOL interpreter: state changes, events, opcodes
      - [0x11884, c, level]        # level start: checkpoints, spawn flags
      - [0x12694, c, camera]       # camera along its path
      - [0x1B294, c, coll]         # collision with the zone surfaces and objects
      - [0x2021C, c, game]         # game state: new game, level objects, spawns
      - [0x21234, c, math]         # geometry and random numbers
      - [0x22A68, c, cdfs]         # files of the CD (ISO 9660)
      - [0x22F10, c, prop]         # properties of the entities
      - [0x23728, asm, "23728"]   # rest of the game C code, to be split into files
      - [0x2A63C, asm, nd_asm]    # Naughty Dog's hand-written assembly (uses the GTE)
      - [0x35F50, asm, psyq]      # PSY-Q libraries (libcd, libgpu, libspu, libapi, ...)
      - [0x4C440, data, "4C440"]
      - [0x51078, .sdata, main]   # $gp = 0x80060878
      - [0x51094, .sdata, ns]
      - [0x510D8, sdata, "510D8"]
      - [0x510E0, .sdata, sys]
      - [0x51120, .sdata, obj]
      - [0x51124, .sdata, interp]
      - [0x51128, .sdata, level]
      - [0x51130, .sdata, camera]
      - [0x511C0, .sdata, coll]
      - [0x511CC, .sdata, game]
      - [0x511D4, .sdata, math]
      - [0x511DC, .sdata, cdfs]
      - [0x51200, sdata, "51200"]
      - { start: 0x51238, type: sbss, vram: 0x80060A38, name: heap_sbss }
      - { type: .sbss, vram: 0x80060A58, name: main }
      - { type: .sbss, vram: 0x80060A60, name: sys }
      - { type: .sbss, vram: 0x80060A90, name: gool }
      - { type: .sbss, vram: 0x80060A98, name: obj }
      - { type: .sbss, vram: 0x80060AA0, name: level }
      - { type: sbss, vram: 0x80060AC0, name: sbss_80060AC0 }
      - { type: .sbss, vram: 0x80060AC8, name: coll }
      - { type: sbss, vram: 0x80060AE8, name: sbss_80060AE8 } # .sbss and .bss of the other files
  # The rest of the file is zero padding up to a multiple of 0x800 (see Makefile).
  - [0x51238]
